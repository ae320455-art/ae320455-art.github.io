<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Terminal — Ahmed Elnahas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--void:#0B0E14;--panel:#10141D;--panel-2:#151B26;--border:#212938;--text:#D7DEE8;--dim:#5C6779;--alert:#FF4D5E;--warn:#FFB454;--safe:#3DDC97;--info:#4FD1FF;--mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--void);color:var(--text);font-family:var(--mono);display:flex;align-items:center;justify-content:center;padding:24px;}
  body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);pointer-events:none;}
  .auth-card{width:100%;max-width:400px;border:1px solid var(--border);background:linear-gradient(180deg, var(--panel) 0%, #0D111A 100%);border-radius:6px;overflow:hidden;position:relative;z-index:1;}
  .auth-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel-2);font-size:11px;color:var(--dim);letter-spacing:.08em;}
  .auth-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--safe);box-shadow:0 0 8px var(--safe);display:inline-block;margin-right:6px;animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .auth-body{padding:28px 26px 24px;}
  .auth-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
  .auth-title{font-size:21px;font-weight:700;color:#F2F5F9;margin:0 0 22px;letter-spacing:-0.01em;}
  .auth-tabs{display:flex;border:1px solid var(--border);border-radius:5px;overflow:hidden;margin-bottom:22px;}
  .auth-tab{flex:1;text-align:center;padding:9px 0;font-size:12px;letter-spacing:.06em;color:var(--dim);cursor:pointer;background:transparent;border:none;font-family:inherit;transition:all .2s ease;}
  .auth-tab.active{background:rgba(79,209,255,.08);color:var(--info);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
  .field input{width:100%;background:#0D111A;border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;padding:10px 12px;border-radius:4px;outline:none;transition:border-color .2s ease;}
  .field input:focus{border-color:var(--info);}
  .field input::placeholder{color:#3A4252;}
  .auth-submit{width:100%;background:var(--info);color:#0B0E14;border:none;font-family:inherit;font-weight:700;font-size:12.5px;letter-spacing:.06em;padding:11px 0;border-radius:4px;cursor:pointer;margin-top:6px;transition:opacity .2s ease;}
  .auth-submit:hover{opacity:.88;}
  .auth-submit:active{opacity:.75;}
  .auth-status{margin-top:14px;font-size:11.5px;min-height:18px;color:var(--dim);display:flex;align-items:center;gap:8px;}
  .auth-status.granted{color:var(--safe);}
  .auth-status .spin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--border);border-top-color:var(--info);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .auth-footer{padding:12px 16px;border-top:1px solid var(--border);background:var(--panel-2);font-size:10.5px;color:#3A4252;text-align:center;letter-spacing:.03em;}
  .strength{display:flex;gap:4px;margin-top:8px;}
  .strength i{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background .2s ease;}
  .strength-label{font-size:10px;color:var(--dim);margin-top:6px;letter-spacing:.03em;}
  .rules{font-size:10px;color:#3A4252;margin-top:8px;line-height:1.7;}
  .rules .ok{color:var(--safe);}
  @media (prefers-reduced-motion: reduce){.auth-bar .dot, .auth-status .spin{animation:none;}}
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-bar">
    <span><span class="dot"></span>access_terminal.sh</span>
    <span id="clock"></span>
  </div>

  <div class="auth-body">
    <div class="auth-eyebrow">// SOC PORTFOLIO ACCESS</div>
    <h1 class="auth-title" id="formTitle">Sign in</h1>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin">LOGIN</button>
      <button class="auth-tab" id="tabSignup">SIGN UP</button>
    </div>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none;">
        <label for="fname">Full name</label>
        <input type="text" id="fname" placeholder="Ahmed Elnahas" autocomplete="off">
      </div>
      <div class="field">
        <label for="femail">Email</label>
        <input type="email" id="femail" placeholder="you@domain.com" autocomplete="off">
      </div>
      <div class="field">
        <label for="fpass">Password</label>
        <input type="password" id="fpass" placeholder="••••••••" autocomplete="off">
        <div class="strength" id="strengthBars" style="display:none;"><i></i><i></i><i></i><i></i></div>
        <div class="strength-label" id="strengthLabel" style="display:none;"></div>
        <div class="rules" id="rulesBox" style="display:none;">
          <div id="ruleLen">○ at least 8 characters</div>
          <div id="ruleUpper">○ one uppercase letter</div>
          <div id="ruleNum">○ one number</div>
          <div id="ruleSym">○ one symbol</div>
        </div>
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Authenticate</button>
      <div class="auth-status" id="status"></div>
    </form>
  </div>

  <div class="auth-footer">Accounts are saved in this browser only — not a real backend</div>
</div>

<script>
(function(){
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const nameField = document.getElementById('nameField');
  const formTitle = document.getElementById('formTitle');
  const submitBtn = document.getElementById('submitBtn');
  const form = document.getElementById('authForm');
  const status = document.getElementById('status');
  const clock = document.getElementById('clock');
  const passInput = document.getElementById('fpass');
  const emailInput = document.getElementById('femail');
  const nameInput = document.getElementById('fname');
  const strengthBars = document.getElementById('strengthBars');
  const strengthLabel = document.getElementById('strengthLabel');
  const rulesBox = document.getElementById('rulesBox');
  const barEls = strengthBars.querySelectorAll('i');

  const STORE_KEY = 'ae_soc_accounts';
  let mode = 'login';

  function getAccounts(){
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveAccounts(accounts){
    localStorage.setItem(STORE_KEY, JSON.stringify(accounts));
  }

  function hash(str){
    let h = 0;
    for (let i = 0; i < str.length; i++){
      h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    }
    return h.toString(16);
  }

  function checkRules(pw){
    return { len: pw.length >= 8, upper: /[A-Z]/.test(pw), num: /[0-9]/.test(pw), sym: /[^A-Za-z0-9]/.test(pw) };
  }

  function updateStrength(){
    const pw = passInput.value;
    const rules = checkRules(pw);
    document.getElementById('ruleLen').innerHTML = (rules.len ? '<span class="ok">✓</span>' : '○') + ' at least 8 characters';
    document.getElementById('ruleUpper').innerHTML = (rules.upper ? '<span class="ok">✓</span>' : '○') + ' one uppercase letter';
    document.getElementById('ruleNum').innerHTML = (rules.num ? '<span class="ok">✓</span>' : '○') + ' one number';
    document.getElementById('ruleSym').innerHTML = (rules.sym ? '<span class="ok">✓</span>' : '○') + ' one symbol';
    const score = Object.values(rules).filter(Boolean).length;
    const colors = ['#212938', '#FF4D5E', '#FFB454', '#FFB454', '#3DDC97'];
    const labels = ['', 'weak', 'fair', 'good', 'strong'];
    barEls.forEach((bar, i) => { bar.style.background = i < score ? colors[score] : '#212938'; });
    strengthLabel.textContent = pw ? 'strength: ' + labels[score] : '';
    return score === 4;
  }

  function isStrong(pw){
    const r = checkRules(pw);
    return r.len && r.upper && r.num && r.sym;
  }

  function setMode(m){
    mode = m;
    tabLogin.classList.toggle('active', m === 'login');
    tabSignup.classList.toggle('active', m === 'signup');
    nameField.style.display = m === 'signup' ? 'block' : 'none';
    strengthBars.style.display = m === 'signup' ? 'flex' : 'none';
    strengthLabel.style.display = m === 'signup' ? 'block' : 'none';
    rulesBox.style.display = m === 'signup' ? 'block' : 'none';
    formTitle.textContent = m === 'login' ? 'Sign in' : 'Create account';
    submitBtn.textContent = m === 'login' ? 'Authenticate' : 'Create account';
    status.className = 'auth-status';
    status.innerHTML = '';
  }

  tabLogin.addEventListener('click', () => setMode('login'));
  tabSignup.addEventListener('click', () => setMode('signup'));
  passInput.addEventListener('input', () => { if (mode === 'signup') updateStrength(); });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const email = emailInput.value.trim().toLowerCase();
    const pw = passInput.value;
    const accounts = getAccounts();

    if (!email || !pw){
      status.className = 'auth-status';
      status.innerHTML = '<span style="color:var(--alert)">✕ enter an email and password</span>';
      return;
    }

    if (mode === 'signup'){
      if (!nameInput.value.trim()){
        status.innerHTML = '<span style="color:var(--alert)">✕ full name is required</span>';
        return;
      }
      if (!isStrong(pw)){
        status.innerHTML = '<span style="color:var(--alert)">✕ password does not meet all requirements</span>';
        return;
      }
      if (accounts[email]){
        status.innerHTML = '<span style="color:var(--alert)">✕ an account with this email already exists</span>';
        return;
      }
      status.className = 'auth-status';
      status.innerHTML = '<span class="spin"></span> creating account…';
      submitBtn.disabled = true;
      setTimeout(() => {
        accounts[email] = { name: nameInput.value.trim(), hash: hash(pw) };
        saveAccounts(accounts);
        status.className = 'auth-status granted';
        status.innerHTML = '✓ account created — sign in now';
        submitBtn.disabled = false;
        form.reset();
        setTimeout(() => setMode('login'), 1200);
      }, 900);
    } else {
      if (!accounts[email]){
        status.innerHTML = '<span style="color:var(--alert)">✕ no account found for this email — sign up first</span>';
        return;
      }
      status.className = 'auth-status';
      status.innerHTML = '<span class="spin"></span> verifying credentials…';
      submitBtn.disabled = true;
      setTimeout(() => {
        if (accounts[email].hash === hash(pw)){
          status.className = 'auth-status granted';
          status.innerHTML = '✓ access granted — welcome back, ' + accounts[email].name + '. redirecting…';
          sessionStorage.setItem('ae_soc_user', accounts[email].name);
          setTimeout(() => { window.location.href = 'index.html'; }, 1100);
        } else {
          status.className = 'auth-status';
          status.innerHTML = '<span style="color:var(--alert)">✕ incorrect password</span>';
          submitBtn.disabled = false;
        }
      }, 900);
    }
  });

  function tick(){
    const d = new Date();
    clock.textContent = d.toTimeString().slice(0,8);
  }
  tick();
  setInterval(tick, 1000);

  setMode('login');
})();
</script>

</body>
</html>
